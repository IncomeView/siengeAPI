services:
  sienge_main:
    profiles: ["full"]
    build: .
    container_name: sienge_main
    env_file: scripts/.env
    volumes:
      - ./scripts:/scripts
      - "/mnt/c/Users/Moacir Faria/Olimpo Participacoes/OLP - CONTROLE/ANALISES/bancos_dados/Logs.xlsx:/scripts/Logs.xlsx"
      - "/mnt/c/Users/Moacir Faria/Olimpo Participacoes/OLP - CONTROLE/BASES TRABALHADAS/JSON:/scripts/JSON"
    command: python -u /scripts/main.py

  api_customers:
    profiles: ["isolated"]
    build: .
    container_name: api_customers
    env_file: scripts/.env
    volumes:
      - ./scripts:/scripts
    command: python -u /scripts/api_customers.py

